<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>html-jev</title>
<meta name="description" content="Paste HTML, describe a pattern, get a typed verdict in one forward pass.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d11'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2345d483' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2345d483'/%3E%3C/svg%3E">
<script type="module" src="https://unpkg.com/@phosphor-icons/web@2.1.1/regular.js"></script>
<script type="module" src="https://unpkg.com/@phosphor-icons/web@2.1.1/fill.js"></script>
<style>
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/geist-400.woff2") format("woff2"); }
  @font-face { font-family: "Geist"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/geist-500.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/geist-mono-400.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/geist-mono-500.woff2") format("woff2"); }

  :root {
    --bg: #0b0d11;
    --surface: #12151b;
    --border: #232936;
    --border-soft: #1b2029;
    --text: #e9edf3;
    --muted: #8f98a8;
    --faint: #5c6575;
    --accent: #45d483;
    --neg: #ff6b5e;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 15px/1.55 "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 48px; }
  .ph { display: inline-block; vertical-align: -0.12em; }

  .top { display: flex; align-items: center; justify-content: space-between;
         margin-bottom: 22px; }
  .wordmark { display: flex; align-items: center; gap: 8px;
              font: 500 15px/1 "Geist Mono", monospace; color: var(--text); }
  .wordmark b { color: var(--accent); font-weight: 500; }
  .top a { display: flex; align-items: center; gap: 6px;
           color: var(--muted); text-decoration: none; font-size: 13px;
           transition: color 150ms; }
  .top a:hover { color: var(--text); }

  .panel { background: var(--surface); border: 1px solid var(--border);
           border-radius: 10px; overflow: hidden; }

  .view { display: none; }
  .view.active { display: block; }

  .panel-body { display: grid; grid-template-columns: 1.25fr 1fr; }
  @media (max-width: 760px) { .panel-body { grid-template-columns: 1fr; } }
  .pane { padding: 16px; }
  .pane + .pane { border-left: 1px solid var(--border-soft); }
  @media (max-width: 760px) {
    .pane + .pane { border-left: none; border-top: 1px solid var(--border-soft); }
  }
  label {
    display: block; font: 400 11px/1 "Geist Mono", monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 9px;
  }
  textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    background: #0d1015; color: #d7dde6; padding: 12px;
    font: 400 12.5px/1.6 "Geist Mono", monospace; resize: vertical;
    transition: border-color 150ms;
  }
  #html { min-height: 380px; }
  @media (max-width: 760px) { #html { min-height: 240px; } }
  #pattern { min-height: 72px; font: 400 14px/1.5 "Geist", sans-serif; }
  textarea:focus { outline: none; border-color: var(--accent); }

  .presets { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .presets.ex { margin: 0 0 10px; }
  .preset {
    appearance: none; border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
    font: 400 12px/1.3 "Geist", sans-serif; padding: 5px 9px;
    transition: border-color 150ms, color 150ms, transform 100ms;
  }
  .preset:hover { border-color: var(--accent); color: var(--text); }
  .preset:active { transform: scale(0.97); }

  .go {
    margin-top: 14px; width: 100%; appearance: none; cursor: pointer;
    border: none; border-radius: 8px; padding: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #07130c;
    font: 500 14px/1 "Geist", sans-serif;
    transition: filter 150ms, transform 100ms;
  }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: scale(0.985); }
  .go:disabled { filter: grayscale(0.4) brightness(0.7); cursor: default; }
  .go .ph { font-size: 15px; }

  /* ── verdict ─────────────────────────────────────────── */
  .verdict {
    border-top: 1px solid var(--border-soft); padding: 16px;
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 12px 24px; align-items: center; min-height: 80px;
  }
  @media (max-width: 760px) { .verdict { grid-template-columns: 1fr; gap: 12px; } }
  .v-left { display: flex; flex-direction: column; gap: 7px; min-width: 210px; }
  .v-word { font: 500 20px/1 "Geist Mono", monospace; display: flex; align-items: center; gap: 8px; }
  .v-word .ph { font-size: 19px; }
  .v-word.yes { color: var(--accent); }
  .v-word.no { color: var(--neg); }
  .v-track { width: 210px; height: 4px; border-radius: 2px;
             background: var(--border-soft); overflow: hidden; }
  .v-fill { height: 100%; width: 100%; border-radius: 2px;
            transform: scaleX(0); transform-origin: left;
            transition: transform 600ms var(--ease-out), background 300ms; }
  .v-pct { font: 400 12px/1 "Geist Mono", monospace; color: var(--muted); }

  .v-facts { display: flex; flex-wrap: wrap; gap: 7px; }
  .fact {
    font: 400 12px/1 "Geist Mono", monospace; color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
    background: #171b23; white-space: nowrap;
  }
  .fact b { font-weight: 500; color: var(--text); }
  .fact.bad b { color: var(--neg); }
  .fact.ok b { color: var(--accent); }

  .v-meta { font: 400 12px/1.9 "Geist Mono", monospace; color: var(--faint);
            text-align: right; white-space: nowrap; }
  @media (max-width: 760px) { .v-meta { text-align: left; } }
  .v-idle { grid-column: 1 / -1; font: 400 13px/1 "Geist Mono", monospace;
            color: var(--faint); }
  .v-idle.busy { color: var(--accent); }
  .v-idle.error { color: var(--neg); }

  footer { margin-top: 18px; font: 400 12.5px/1.6 "Geist Mono", monospace;
           color: var(--faint); }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .v-fill { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="wordmark"><i class="ph ph-crosshair" style="color:var(--accent)"></i>html<b>-jev</b></span>
    <a href="https://github.com/rheono/html-jev" target="_blank"><i class="ph ph-github-logo" style="font-size:15px"></i>github</a>
  </div>

  <div class="panel">
    <div class="view active" id="view-match">
      <div class="panel-body">
        <div class="pane">
          <label for="html">html</label>
          <div class="presets ex" id="exchips"></div>
          <textarea id="html" spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <label for="pattern">pattern</label>
          <textarea id="pattern" spellcheck="false"></textarea>
          <div class="presets" id="presets"></div>
          <button class="go" id="go"><i class="ph ph-magnifying-glass"></i>Match</button>
        </div>
      </div>
      <div class="verdict" id="verdict">
        <div class="v-idle" id="vidle">running…</div>
      </div>
    </div>
  </div>

  <footer>
    they said it was impossible in <a href="https://stackoverflow.com/questions/1732348" target="_blank">2009</a>
  </footer>
</main>

<script>
const SAMPLE = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example</title>
  <link rel="stylesheet" href="/style.css">
  <!-- TODO: remove tracking before launch -->
</head>
<body>
  <header><nav><a href="/">Home</a> <a href="/about">About</a></nav></header>
  <main>
    <h1>Hello</h1>
    <p>Some text with <em>emphasis</em> and an unclosed <b>bold tag.</p>
    <a href="https://example.com?x=1" title="is 5 > 3?">external link</a>
    <img src="/pic.png" alt="pic" />
  </main>
  <footer><small>&copy; 2026</small></footer>
</body>
</html>`;

const PRESETS = [
  "opening tags that are never closed",
  "self-closing tags such as <br/> or <img ... />",
  "a > character inside an attribute value",
  "an HTML comment",
  "an anchor pointing to a domain other than this page",
];

const $ = (id) => document.getElementById(id);
const htmlEl = $("html"), patternEl = $("pattern"), goBtn = $("go"), verdictEl = $("verdict");
htmlEl.value = SAMPLE;
patternEl.value = PRESETS[0];

function chip(parent, text, onclick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "preset";
  b.textContent = text;
  b.onclick = onclick;
  parent.appendChild(b);
}

PRESETS.forEach((p) => chip($("presets"), p, () => { patternEl.value = p; }));

const EXAMPLES = [
  ["sample page", null],
  ["broken table", "/examples/broken-table.html"],
  ["ycombinator.com", "/examples/ycombinator.html"],
];
EXAMPLES.forEach(([name, url]) =>
  chip($("exchips"), name, async () => {
    htmlEl.value = url ? await (await fetch(url)).text() : SAMPLE;
  })
);
function fact(k, v, cls) {
  return `<span class="fact ${cls || ""}">${k}: <b>${v}</b></span>`;
}

function render(d) {
  const yes = d.match >= 0.5;
  const pct = Math.round(d.match * 100);
  const s = d.stats;
  const unclosed = s.unclosed.length ? s.unclosed.join(", ") : "none";
  verdictEl.innerHTML = `
    <div class="v-left">
      <div class="v-word ${yes ? "yes" : "no"}"><i class="ph ${yes ? "ph-check-circle" : "ph-x-circle"}"></i>${yes ? "MATCH" : "NO MATCH"}</div>
      <div class="v-track"><div class="v-fill" id="vfill"></div></div>
      <div class="v-pct">${pct}%</div>
    </div>
    <div class="v-facts">
      ${fact("tags", s.tags)}
      ${fact("depth", s.max_depth)}
      ${fact("self-closing", s.self_closing)}
      ${fact("unclosed", unclosed, s.unclosed.length ? "bad" : "ok")}
    </div>
    <div class="v-meta">
      ${d.latency_ms} ms<br>
      ${d.model} · $${d.cost_usd.toPrecision(2)}
    </div>`;
  requestAnimationFrame(() => {
    const f = $("vfill");
    if (f) { f.style.background = yes ? "var(--accent)" : "var(--neg)"; f.style.transform = `scaleX(${pct / 100})`; }
  });
}

async function run() {
  goBtn.disabled = true;
  verdictEl.innerHTML = `<div class="v-idle busy">one forward pass…</div>`;
  try {
    const r = await fetch("/match", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ html: htmlEl.value, pattern: patternEl.value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || d.error || r.statusText);
    render(d);
  } catch (e) {
    verdictEl.innerHTML = `<div class="v-idle error">error: ${e.message}</div>`;
  }
  goBtn.disabled = false;
}

goBtn.onclick = run;
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || (e.key.toLowerCase() === "m" && e.shiftKey)) && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    run();
  }
});

run();
</script>
</body>
</html>
